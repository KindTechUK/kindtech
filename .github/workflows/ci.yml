name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, format & types
    runs-on: ubuntu-latest
    env:
      UV_PYTHON: "3.12"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.6"

      - name: Ruff lint
        run: uv run --group dev ruff check .

      - name: Ruff format check
        run: uv run --group dev ruff format --check .

      - name: ast-grep scan
        run: uv run --with ast-grep-cli ast-grep scan --config .ast-grep/sgconfig.yml src/

      - name: Type check (ty)
        run: uv run --group dev ty check src

      - name: Build docs
        run: uv run --group dev mkdocs build --strict

  test:
    name: Tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.6"

      - name: Run tests
        run: uv run --group dev pytest

  package:
    name: Build & smoke-test distributions
    runs-on: ubuntu-latest
    env:
      UV_PYTHON: "3.13"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.6"

      - name: Build distributions
        run: uv build --no-sources

      - name: Smoke-test wheel
        run: uv run --isolated --no-project --with dist/*.whl tests/smoke_test.py

      - name: Smoke-test source distribution
        run: uv run --isolated --no-project --with dist/*.tar.gz tests/smoke_test.py

      - name: Smoke-test pandas backend
        run: >-
          uv run --isolated --no-project --with dist/*.whl --with pandas
          tests/backend_smoke_test.py pandas

      - name: Smoke-test polars backend
        run: >-
          uv run --isolated --no-project --with dist/*.whl --with polars
          tests/backend_smoke_test.py polars
