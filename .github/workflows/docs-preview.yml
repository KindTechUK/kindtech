name: Deploy docs preview

on:
  pull_request:
    types: [opened, reopened, synchronize, closed]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "examples/**"
      - ".github/workflows/docs-preview.yml"

# contents:write to push the preview to gh-pages; pull-requests:write for the sticky comment.
permissions:
  contents: write
  pull-requests: write

concurrency: preview-${{ github.ref }}

jobs:
  deploy-preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        if: github.event.action != 'closed'
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.6"

      - name: Build site
        if: github.event.action != 'closed'
        run: uv run --group dev mkdocs build --strict

      - name: Deploy preview
        uses: rossjrw/pr-preview-action@873417d2df72380da1f3978378fb58560bcde976 # v1.8.2
        with:
          source-dir: ./site/
          preview-branch: gh-pages
          umbrella-dir: pr-preview
