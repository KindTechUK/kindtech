[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "uk-open-data"
version = "0.1.0"
description = "All things kindtech repository - kindtech monorepo"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.28",
    "narwhals>=2.18.0",
    "python-calamine>=0.2",
]

[project.scripts]
uk-open-data = "uk_open_data.cli:main"
kindtech = "uk_open_data.cli:main"

[project.urls]
Homepage = "https://github.com/KindTechUK/kindtech"
Documentation = "https://kindtechuk.github.io/kindtech/"
Repository = "https://github.com/KindTechUK/kindtech"
Issues = "https://github.com/KindTechUK/kindtech/issues"

[project.optional-dependencies]
connector = [
    "mcp>=2.3,<3",
    "pandas>=2.0.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.package-data]
"uk_open_data.geo" = ["data/*.csv"]
"uk_open_data.ons" = ["data/*.csv"]

[dependency-groups]
dev = [
    "mcp>=2.3,<3",
    "mkdocs>=1.6.1",
    "mkdocs-llmstxt-md>=0.2.0",
    "mkdocs-material>=9.6.14",
    "pandas>=2.0.0",
    "prek>=0.3.5",
    "pytest>=8.0",
    "pytest-cov>=7.0.0",
    "ruff>=0.12.0",
    "ty>=0.0.21",
]
ingestion = [
    "requests>=2.28",
]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "A", "C4", "SIM", "ERA"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"examples/*.py" = ["B018"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
